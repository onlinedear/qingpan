name = "qingpan"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "web"

# 密钥不要写在这里。本地开发放 .dev.vars（已被 .gitignore 忽略），线上在 Cloudflare 后台配置：
#   MCD_MCP_TOKEN  麦当劳中国 MCP Token（体验模式用，只放行公共工具）
#   TMAP_WEB_KEY   腾讯地图 WebService Key（定位 / 逆地理 / 地理编码 / 步行路线）
#   TMAP_SK        腾讯地图 WebService 签名密钥（可选；控制台开了「签名校验」才需要）
# 天气走 open-meteo 免费接口，无需 Key。
# nodejs_compat：腾讯签名用到 node:crypto 的 md5，必须开此兼容标志。
